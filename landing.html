<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RC Celta — ¡Avísame!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --celta-sky: #7AB1D9;
        --celta-sky-dark: #5C97C2;
        --celta-navy: #0A1A3F;
        --celta-red: #E4002B;
        --celta-red-dark: #B80022;
        --page-bg: #F4F6F9;
        --card-border: #E2E6EC;
        --muted: #5A6478;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: var(--celta-navy);
        line-height: 1.55;
        background-color: var(--page-bg);
      }


      /* Top nav strip — mirrors rccelta.es light header */
      .topbar {
        background: #fff;
        border-bottom: 1px solid var(--card-border);
        padding: 0.75rem 1.5rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .topbar img {
        height: 32px;
        width: auto;
      }

      .topbar span {
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 0.95rem;
        color: var(--celta-navy);
      }

      /* Hero */
      header.hero {
        background:
          linear-gradient(180deg, rgba(10, 26, 63, 0.05), rgba(10, 26, 63, 0.18)),
          var(--celta-sky);
        color: #fff;
        text-align: center;
        padding: 4rem 1.5rem 4.5rem;
        position: relative;
      }

      header.hero::after {
        content: "";
        display: block;
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 6px;
        background: var(--celta-navy);
      }

      header.hero img {
        max-width: 130px;
        height: auto;
        margin-bottom: 1.25rem;
        filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.18));
      }

      header.hero h1 {
        color: #fff;
        margin: 0 0 0.75rem;
        font-size: 2.75rem;
        font-weight: 800;
        letter-spacing: -0.01em;
        line-height: 1.1;
      }

      header.hero p {
        margin: 0 auto;
        max-width: 520px;
        font-size: 1.05rem;
        opacity: 0.95;
      }

      /* Bottom section — players photo behind the form card */
      .page-bottom {
        background:
          linear-gradient(180deg, rgba(244, 246, 249, 0.4), rgba(10, 26, 63, 0.55)),
          url("assets/players.jpeg") center/cover no-repeat;
        padding-bottom: 3rem;
      }

      /* Form card */
      main {
        max-width: 520px;
        margin: -2.5rem auto 0;
        padding: 0 1rem;
        position: relative;
      }

      .card {
        background: #fff;
        border: 1px solid var(--card-border);
        border-radius: 6px;
        padding: 2rem 1.75rem;
        box-shadow: 0 4px 18px rgba(10, 26, 63, 0.06);
      }

      form p {
        margin: 0 0 1.25rem;
      }

      label {
        display: block;
        font-weight: 600;
        margin-bottom: 0.4rem;
        font-size: 0.9rem;
        color: var(--celta-navy);
      }

      input[type="text"],
      input[type="email"],
      select {
        width: 100%;
        padding: 0.7rem 0.85rem;
        font: inherit;
        color: var(--celta-navy);
        border: 1px solid #CBD2DC;
        border-radius: 4px;
        background: #fff;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      input[type="text"]:focus,
      input[type="email"]:focus,
      select:focus {
        outline: none;
        border-color: var(--celta-sky);
        box-shadow: 0 0 0 3px rgba(122, 177, 217, 0.25);
      }

      input[type="checkbox"] {
        margin-right: 0.55rem;
        accent-color: var(--celta-sky-dark);
      }

      form p:has(> label > input[type="checkbox"]) label {
        font-weight: 400;
        font-size: 0.9rem;
        color: var(--muted);
      }

      button[type="submit"] {
        display: block;
        width: 100%;
        padding: 0.95rem 1rem;
        background-color: var(--celta-red);
        color: #fff;
        font: inherit;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        border: none;
        border-radius: 3px;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }

      button[type="submit"]:hover {
        background-color: var(--celta-red-dark);
      }

      /* Footer */
      footer {
        background: var(--celta-navy);
        color: #fff;
        text-align: center;
        padding: 1.5rem 1rem;
        font-size: 0.85rem;
        letter-spacing: 0.04em;
      }

      footer span {
        opacity: 0.75;
      }

      @media (min-width: 640px) {
        header.hero { padding: 5rem 2rem 5.5rem; }
        header.hero h1 { font-size: 3.25rem; }
        .card { padding: 2.5rem 2.25rem; }
      }
    </style>
  </head>

    <script>
      document.getElementById('avisame-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const data = Object.fromEntries(fd.entries());
        data.privacidad = e.target.privacidad.checked;
        console.log('Avísame submission:', data);
      });
